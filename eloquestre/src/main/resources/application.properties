spring.application.name=hc-jobs
spring.mongodb.uri=mongodb+srv://f3rnNot:s4US5c1UcI0f5BtT@neogendmongodb.i1lpdho.mongodb.net/relatorios?retryWrites=true&w=majority

server.port=${PORT:8040}

spring.data.mongodb.auto-index-creation=true
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=1440
# Spring Boot 4: server.error.* virou spring.web.error.*
spring.web.error.include-message=always
# Origens liberadas para o app web (Expo web roda em http://localhost:8081)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:8081,http://localhost:8082,http://localhost:19006}

# JSON em snake_case (contrato do app: src/lib/types.ts)
spring.jackson.property-naming-strategy=SNAKE_CASE

# Uploads (foto de perfil e mídias). Pasta no disco do servidor.
app.storage.dir=${STORAGE_DIR:uploads}
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=110MB

# Notificações push pela Expo (desligue em testes)
app.push.enabled=${PUSH_ENABLED:true}
# Webhook da RevenueCat: mesmo valor configurado lá como "Authorization: Bearer <segredo>"
app.revenuecat.webhook-secret=${REVENUECAT_WEBHOOK_SECRET:}

# Links dos e-mails (abre o app em app/auth/callback.tsx)
app.auth.callback-url=${AUTH_CALLBACK_URL:eloequestre://auth/callback}
# SMTP (sem SMTP_HOST o e-mail só aparece no console do servidor)
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:ELOequestre <nao-responda@horsecontrol.com.br>}
